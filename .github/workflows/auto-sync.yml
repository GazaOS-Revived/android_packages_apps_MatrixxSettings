name: Auto Sync Fork

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: # manual trigger option

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "frnwot"
          git config user.email "frnbuid2005@gmail.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/ProjectMatrixx/android_packages_apps_MatrixxSettings.git
          git fetch upstream

      - name: Check for new upstream commits
        id: check
        run: |
          git fetch upstream main
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          LOCAL_HASH=$(git rev-parse origin/main)
          echo "UPSTREAM_HASH=$UPSTREAM_HASH" >> $GITHUB_ENV
          echo "LOCAL_HASH=$LOCAL_HASH" >> $GITHUB_ENV

          if [ "$UPSTREAM_HASH" = "$LOCAL_HASH" ]; then
            echo "No new commits."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New commits found!"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream/main into fork/main
        if: steps.check.outputs.skip == 'false'
        run: |
          git checkout main
          git merge upstream/main --no-edit || true

      - name: Push changes to your fork
        if: steps.check.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/GazaOS-Revived/android_packages_apps_MatrixxSettings.git main
          
